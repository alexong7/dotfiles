[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+double_quote"
split_vertical    = "prefix+percent"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
previous_tab = "ctrl+alt+left"
next_tab     = "ctrl+alt+right"
previous_workspace = "ctrl+alt+up"
next_workspace     = "ctrl+alt+down"
workspace_picker = "prefix+w"
goto             = "prefix+g"
open_worktree    = "prefix+o"
remove_worktree  = "prefix+shift+x"
copy_mode  = "prefix+y"

[ui]
agent_panel_sort = "priority"
sidebar_max_width = 44
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "system"

[experimental]
pane_history = false
